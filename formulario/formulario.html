<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Inscripción</title>
</head>
<body>

    <form>
        <!-- Sección 1: Datos Personales -->
        <fieldset>
            <legend>Datos Personales</legend>
            <p>
                <label>Nombre:<br>
                    <input type="text" name="nombre">
                </label>
                <label>Apellidos:<br>
                    <input type="text" name="apellidos">
                </label>
                <label>DNI:<br>
                    <input type="text" name="dni">
                </label>
            </p>
            <p>
                <label>Localidad de Nacimiento:<br>
                    <input type="text" name="localidad">
                </label>
                <label>Provincia:<br>
                    <select name="provincia">
                        <option value="huelva">Huelva</option>
                        <!-- Se pueden agregar más opciones aquí -->
                    </select>
                </label>
                <label>Fecha de Nacimiento:<br>
                    <input type="text" name="fecha_nacimiento" placeholder="dd/mm/aaaa">
                </label>
            </p>
            <p>
                <label>Dirección:<br>
                    <input type="text" name="direccion">
                </label>
                <label>Código Postal:<br>
                    <input type="text" name="codigo_postal">
                </label>
            </p>
        </fieldset>

        <br>

        <!-- Sección 2: Forma de Acceso -->
        <fieldset>
            <legend>Forma de Acceso</legend>
            <ul style="list-style-type: none; padding-left: 0;">
                <li>
                    <label><input type="radio" name="forma_acceso" value="directo"> Directo</label>
                    <ul style="list-style-type: none; padding-left: 20px;">
                        <li>
                            <label>
                                <input type="radio" name="sub_acceso" value="bachillerato"> Bachillerato Log Modalidad
                                <input type="text" name="modalidad_bach">
                            </label>
                        </li>
                        <li>
                            <label><input type="radio" name="sub_acceso" value="experimental"> Experimental</label>
                        </li>
                        <li>
                            <label>
                                <input type="radio" name="sub_acceso" value="cou"> COU Opción
                                <input type="text" name="opcion_cou">
                            </label>
                        </li>
                        <li>
                            <label><input type="radio" name="sub_acceso" value="fp2"> FP2</label>
                        </li>
                        <li>
                            <label>
                                <input type="radio" name="sub_acceso" value="otros"> Otros (especifique)
                                <input type="text" name="otros_acceso">
                            </label>
                        </li>
                    </ul>
                </li>
                <li>
                    <label><input type="radio" name="forma_acceso" value="prueba_libre"> Prueba Libre</label>
                </li>
            </ul>
        </fieldset>

        <br>

        <!-- Sección 3: Documentos Adjuntados -->
        <fieldset>
            <legend>Documentos Adjuntados</legend>
            <p>
                <label><input type="checkbox" name="doc_dni"> Fotocopia DNI</label>
                &nbsp;&nbsp;&nbsp;
                <label><input type="checkbox" name="doc_certificado"> Certificado Académico</label>
            </p>
            <p>
                <label>
                    <input type="checkbox" name="doc_otros"> Otros documentos (especifique)
                    <input type="text" name="especifique_doc">
                </label>
            </p>
        </fieldset>
    </form>
<a href="../index.html">Volver a inicio</a>
</body>
</html>
