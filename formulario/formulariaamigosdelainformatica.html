<!DOCTYPE html>
<header>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de reserva</title>
    <body>
<h2>Amigos de la informática</h2>

<h3>Datos personales</h3>

<label for="nombre">Nombre:</label>
<input type="text" id="nombre" name="nombre">

<br>

<label for="domicilio">Domicilio:</label>
<input type="text" id="domicilio" name="domicilio" placeholder="calle, número y localidad">

<br>

<label for="pais">País de origen:</label>
<select id="pais" name="pais">
  <option value="espana">España</option>
</select>

<br>

<label for="fecha">Fecha de nacimiento:</label>
<input type="text" id="fecha" name="fecha" placeholder="dd/mm/aaaa">

<br>

<label for="correo">Correo electrónico:</label>
<input type="email" id="correo" name="correo">

<br>

<label for="telefono">Teléfono:</label>
<input type="tel" id="telefono" name="telefono">

<br>

<span>Estado civil:</span>
<label><input type="radio" name="estado_civil" value="solter"> Solter@</label>
<label><input type="radio" name="estado_civil" value="casado"> Casad@</label>
<label><input type="radio" name="estado_civil" value="separado"> Separad@</label>
<label><input type="radio" name="estado_civil" value="viudo"> Viud@</label>

<br>

<span>Sexo:</span>
<label><input type="radio" name="sexo" value="hombre"> Hombre</label>
<label><input type="radio" name="sexo" value="mujer"> Mujer</label>

<h3>Otra información de interés</h3>

<label for="dispositivos">Seleccione los componentes electrónicos con los que habitualmente trabajas:</label>
<select id="dispositivos" name="dispositivos" multiple size="4">
  <option value="movil">Móvil</option>
  <option value="tablet">Tablet</option>
  <option value="ordenador">Ordenador</option>
  <option value="ebook">Ebook</option>
</select>

<p>Seleccione tus actividades favoritas:</p>

<label><input type="checkbox" name="actividades" value="deporte"> Hacer deporte</label>
<label><input type="checkbox" name="actividades" value="amigos"> Salir con mis amigos</label>
<label><input type="checkbox" name="actividades" value="series"> Ver series, pelis,...</label>
<label><input type="checkbox" name="actividades" value="senderismo"> Realizar rutas de senderismo</label>
<label><input type="checkbox" name="actividades" value="cine"> Ir al cine</label>
<label><input type="checkbox" name="actividades" value="musica"> Escuchar música</label>

<br>

<label for="motivo">Explique brevemente el motivo por el que desea ingresar en nuestro club:</label>
<br>
<textarea id="motivo" name="motivo" rows="4" cols="50"></textarea>

<br>

<label for="pelicula">Elige o escribe tu peli favorita:</label>
<input type="text" id="pelicula" name="pelicula">

<br>

<button type="submit">Enviar</button>
<button type="reset">Cancelar</button>
<a href="../index.html">Volver a inicio</a>
<footer>
